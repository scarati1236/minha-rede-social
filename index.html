<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scaratigram - Sua Rede Social de Texto</title>
    <style>
        :root {
            --primary-color: #ff0000; /* Vermelho */
            --bg-color: #ffffff;      /* Branco */
            --text-main: #000000;
            --text-secondary: #555555;
            --border-color: #ff0000;
            --card-bg: #fffafa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        /* Navbar */
        nav {
            background-color: var(--primary-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .user-nav {
            font-weight: bold;
            cursor: pointer;
        }

        /* Container */
        .container {
            max-width: 650px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Auth Screen */
        #auth-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80vh;
        }

        .auth-card {
            border: 3px solid var(--primary-color);
            padding: 30px;
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
        }

        .auth-card h2 {
            margin-bottom: 20px;
            color: var(--primary-color);
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid var(--primary-color);
            font-family: inherit;
        }

        /* Main Feed (Hidden by default) */
        #main-app {
            display: none;
        }

        /* Post Box */
        .post-box {
            border: 2px solid var(--primary-color);
            padding: 20px;
            margin-bottom: 30px;
            background: var(--card-bg);
        }

        textarea {
            width: 100%;
            border: 1px solid var(--primary-color);
            background: #ffffff;
            padding: 15px;
            resize: none;
            outline: none;
            font-size: 16px;
            margin-bottom: 10px;
            font-family: inherit;
        }

        .post-box-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: 2px solid var(--primary-color);
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }

        button:hover {
            background-color: white;
            color: var(--primary-color);
        }

        .btn-outline {
            background-color: white;
            color: var(--primary-color);
        }

        /* Feed Posts */
        .post {
            border: 1px solid var(--primary-color);
            padding: 20px;
            margin-bottom: 20px;
            background: white;
        }

        .post-header {
            margin-bottom: 15px;
            border-bottom: 1px dashed var(--primary-color);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .post-user-name {
            font-weight: bold;
            color: var(--primary-color);
        }

        .post-time {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .post-content {
            margin-bottom: 20px;
            line-height: 1.6;
            font-size: 18px;
        }

        .post-actions {
            display: flex;
            gap: 25px;
        }

        .action-btn {
            color: var(--primary-color);
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            text-decoration: underline;
        }

        .logout-btn {
            font-size: 12px;
            text-decoration: underline;
            cursor: pointer;
        }

        /* Utility */
        .hidden { display: none; }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="logo">Scaratigram</a>
        <div id="nav-user-info" class="user-nav">
            <!-- Nome do usuário aparecerá aqui -->
        </div>
    </nav>

    <div class="container">
        <!-- Tela de Autenticação -->
        <div id="auth-screen">
            <div class="auth-card">
                <h2 id="auth-title">CRIAR CONTA</h2>
                <input type="text" id="usernameInput" placeholder="NOME DE USUÁRIO">
                <button id="btnStart" style="width: 100%;">ENTRAR NA REDE</button>
            </div>
        </div>

        <!-- Aplicativo Principal -->
        <div id="main-app">
            <div class="post-box">
                <textarea id="postInput" placeholder="O QUE VOCÊ ESTÁ PENSANDO?" rows="3"></textarea>
                <div class="post-box-footer">
                    <span class="logout-btn" onclick="logout()">[ SAIR ]</span>
                    <button id="btnPost">PUBLICAR</button>
                </div>
            </div>

            <div id="feed">
                <!-- Posts aparecerão aqui -->
            </div>
        </div>
    </div>

    <script>
        // Seletores
        const authScreen = document.getElementById('auth-screen');
        const mainApp = document.getElementById('main-app');
        const usernameInput = document.getElementById('usernameInput');
        const btnStart = document.getElementById('btnStart');
        const navUserInfo = document.getElementById('nav-user-info');
        const postInput = document.getElementById('postInput');
        const btnPost = document.getElementById('btnPost');
        const feed = document.getElementById('feed');

        // Estado da Aplicação
        let currentUser = localStorage.getItem('scaratigram_user') || null;
        let posts = JSON.parse(localStorage.getItem('scaratigram_posts')) || [
            {
                id: 1,
                user: 'SISTEMA',
                content: 'BEM-VINDO AO SCARATIGRAM. UMA REDE SOCIAL EM VERMELHO E BRANCO.',
                time: 'INÍCIO',
                likes: 0,
                liked: false
            }
        ];

        // Inicialização
        function init() {
            if (currentUser) {
                showApp();
            } else {
                showAuth();
            }
            renderPosts();
        }

        function showAuth() {
            authScreen.style.display = 'flex';
            mainApp.style.display = 'none';
            navUserInfo.textContent = '';
        }

        function showApp() {
            authScreen.style.display = 'none';
            mainApp.style.display = 'block';
            navUserInfo.textContent = `[ @${currentUser.toUpperCase()} ]`;
        }

        function saveData() {
            localStorage.setItem('scaratigram_posts', JSON.stringify(posts));
        }

        function renderPosts() {
            feed.innerHTML = '';
            posts.forEach(post => {
                const postElement = document.createElement('div');
                postElement.className = 'post';
                postElement.innerHTML = `
                    <div class="post-header">
                        <span class="post-user-name">@${post.user}</span>
                        <span class="post-time">${post.time}</span>
                    </div>
                    <div class="post-content">
                        ${post.content}
                    </div>
                    <div class="post-actions">
                        <span class="action-btn" onclick="toggleLike(${post.id})">
                            ${post.liked ? '[ CURTIDO ]' : '[ CURTIR ]'} (${post.likes})
                        </span>
                    </div>
                `;
                feed.appendChild(postElement);
            });
        }

        function toggleLike(id) {
            const post = posts.find(p => p.id === id);
            if (post) {
                if (post.liked) {
                    post.likes--;
                    post.liked = false;
                } else {
                    post.likes++;
                    post.liked = true;
                }
                saveData();
                renderPosts();
            }
        }

        function logout() {
            localStorage.removeItem('scaratigram_user');
            currentUser = null;
            showAuth();
        }

        // Eventos
        btnStart.addEventListener('click', () => {
            const name = usernameInput.value.trim();
            if (name) {
                currentUser = name;
                localStorage.setItem('scaratigram_user', name);
                showApp();
            } else {
                alert('POR FAVOR, INSIRA UM NOME.');
            }
        });

        btnPost.addEventListener('click', () => {
            const content = postInput.value.trim();
            if (content) {
                const now = new Date();
                const timeStr = `${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}`;
                
                const newPost = {
                    id: Date.now(),
                    user: currentUser.toUpperCase(),
                    content: content.toUpperCase(),
                    time: timeStr,
                    likes: 0,
                    liked: false
                };
                
                posts.unshift(newPost);
                postInput.value = '';
                saveData();
                renderPosts();
            }
        });

        // Rodar ao carregar
        init();
    </script>
</body>
</html>
