<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scaratigram | Premium Text Network</title>
    <style>
        :root {
            --primary: #000000;
            --bg: #ffffff;
            --surface: #fcfcfc;
            --border: #e0e0e0;
            --text: #000000;
            --text-muted: #666666;
            --accent: #000000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        /* Layout */
        nav {
            background: var(--bg);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 40px;
        }

        /* Auth */
        #auth-screen {
            position: fixed;
            inset: 0;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .auth-card {
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        .auth-card h1 { font-size: 32px; margin-bottom: 30px; }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid var(--primary);
            outline: none;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: 1px solid var(--primary);
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
        }

        button:hover { background: white; color: black; }

        /* Feed & Posts */
        .post-composer {
            border: 1px solid var(--primary);
            padding: 20px;
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;
            border: none;
            resize: none;
            outline: none;
            font-size: 16px;
            margin-bottom: 15px;
            min-height: 80px;
        }

        .post {
            border-bottom: 1px solid var(--border);
            padding: 30px 0;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .user-tag { font-weight: 800; cursor: pointer; }
        .user-tag:hover { text-decoration: underline; }

        .post-content { font-size: 18px; margin-bottom: 20px; }

        .post-footer { display: flex; gap: 20px; font-size: 13px; font-weight: bold; }
        .action { cursor: pointer; text-decoration: underline; }

        /* Sidebar & DMs */
        .sidebar-section {
            border: 1px solid var(--primary);
            padding: 20px;
            margin-bottom: 20px;
        }

        .sidebar-section h3 {
            font-size: 14px;
            text-transform: uppercase;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--primary);
            padding-bottom: 5px;
        }

        .dm-item {
            font-size: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            background: black;
            color: white;
            padding: 2px 6px;
            font-size: 10px;
            border-radius: 10px;
        }

        /* Modal DMs */
        #dm-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 3000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 500px;
            height: 600px;
            display: flex;
            flex-direction: column;
            border: 2px solid black;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid black;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg {
            padding: 10px;
            max-width: 80%;
            font-size: 14px;
        }

        .msg.sent { align-self: flex-end; background: black; color: white; }
        .msg.received { align-self: flex-start; border: 1px solid black; }

        .modal-input {
            padding: 20px;
            border-top: 1px solid black;
            display: flex;
            gap: 10px;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
            nav { padding: 15px 20px; }
        }
    </style>
</head>
<body>

    <!-- Auth -->
    <div id="auth-screen">
        <div class="auth-card">
            <h1>SCARATIGRAM</h1>
            <input type="text" id="usernameInput" placeholder="IDENTIDADE (NOME)">
            <button onclick="login()">ACESSAR REDE</button>
        </div>
    </div>

    <nav>
        <div class="logo">SCARATIGRAM</div>
        <div class="nav-links">
            <span id="nav-user" style="font-weight: 800;"></span>
            <span class="action" onclick="logout()">SAIR</span>
        </div>
    </nav>

    <div class="container">
        <main>
            <div class="post-composer">
                <textarea id="postInput" placeholder="O QUE HÁ DE NOVO?"></textarea>
                <button onclick="createPost()">PUBLICAR</button>
            </div>
            <div id="feed"></div>
        </main>

        <aside>
            <div class="sidebar-section">
                <h3>SOLICITAÇÕES DE DM</h3>
                <div id="dm-requests"></div>
            </div>
            <div class="sidebar-section">
                <h3>CONVERSAS ATIVAS</h3>
                <div id="active-chats"></div>
            </div>
        </aside>
    </div>

    <!-- DM Modal -->
    <div id="dm-modal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="chat-with-name" style="font-weight: 900;">NOME</span>
                <span class="action" onclick="closeDM()">FECHAR</span>
            </div>
            <div id="chat-messages"></div>
            <div class="modal-input">
                <input type="text" id="dmInput" placeholder="MENSAGEM...">
                <button style="width: 80px;" onclick="sendDM()">ENVIAR</button>
            </div>
        </div>
    </div>

    <script>
        // State
        let user = localStorage.getItem('s_user') || null;
        let posts = JSON.parse(localStorage.getItem('s_posts')) || [];
        let dms = JSON.parse(localStorage.getItem('s_dms')) || {}; // { user1: { user2: { status: 'pending/active', messages: [] } } }
        let currentChat = null;

        function login() {
            const val = document.getElementById('usernameInput').value.trim().toLowerCase();
            if(val) {
                user = val;
                localStorage.setItem('s_user', user);
                location.reload();
            }
        }

        function logout() {
            localStorage.removeItem('s_user');
            location.reload();
        }

        function init() {
            if(!user) {
                document.getElementById('auth-screen').style.display = 'flex';
                return;
            }
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('nav-user').textContent = `@${user.toUpperCase()}`;
            renderFeed();
            renderSidebar();
        }

        function createPost() {
            const content = document.getElementById('postInput').value.trim();
            if(!content) return;
            const newPost = {
                id: Date.now(),
                author: user,
                content: content.toUpperCase(),
                date: new Date().toLocaleTimeString(),
                likes: 0
            };
            posts.unshift(newPost);
            localStorage.setItem('s_posts', JSON.stringify(posts));
            document.getElementById('postInput').value = '';
            renderFeed();
        }

        function renderFeed() {
            const feed = document.getElementById('feed');
            feed.innerHTML = posts.map(p => `
                <div class="post">
                    <div class="post-header">
                        <span class="user-tag" onclick="requestDM('${p.author}')">@${p.author.toUpperCase()}</span>
                        <span>${p.date}</span>
                    </div>
                    <div class="post-content">${p.content}</div>
                    <div class="post-footer">
                        <span class="action">CURTIR (${p.likes})</span>
                        <span class="action" onclick="requestDM('${p.author}')">ENVIAR DM</span>
                    </div>
                </div>
            `).join('');
        }

        // DM Logic
        function requestDM(target) {
            if(target === user) return;
            
            // Garantir estrutura
            if(!dms[target]) dms[target] = {};
            
            // Se já existe uma conversa ativa em qualquer direção
            let isActive = (dms[target][user] && dms[target][user].status === 'active') || 
                           (dms[user] && dms[user][target] && dms[user][target].status === 'active');

            if(isActive) {
                openDM(target);
            } else {
                // Se não existe, criar solicitação
                if(!dms[target][user]) {
                    dms[target][user] = { status: 'pending', messages: [] };
                    alert(`SOLICITAÇÃO DE DM ENVIADA PARA @${target.toUpperCase()}`);
                } else {
                    alert(`SOLICITAÇÃO JÁ ESTÁ PENDENTE COM @${target.toUpperCase()}`);
                }
            }
            saveDMs();
            renderSidebar();
        }

        function acceptDM(requester) {
            if(dms[user] && dms[user][requester]) {
                dms[user][requester].status = 'active';
                saveDMs();
                renderSidebar();
                openDM(requester);
            }
        }

        function openDM(target) {
            currentChat = target;
            document.getElementById('dm-modal').style.display = 'flex';
            document.getElementById('chat-with-name').textContent = `@${target.toUpperCase()}`;
            renderMessages();
        }

        function closeDM() {
            document.getElementById('dm-modal').style.display = 'none';
            currentChat = null;
        }

        function sendDM() {
            const text = document.getElementById('dmInput').value.trim();
            if(!text || !currentChat) return;

            let chat;
            if(dms[user] && dms[user][currentChat]) chat = dms[user][currentChat];
            else if(dms[currentChat] && dms[currentChat][user]) chat = dms[currentChat][user];

            if(chat) {
                chat.messages.push({ sender: user, text: text.toUpperCase() });
                saveDMs();
                renderMessages();
                document.getElementById('dmInput').value = '';
            }
        }

        function renderMessages() {
            const container = document.getElementById('chat-messages');
            let chat;
            if(dms[user] && dms[user][currentChat]) chat = dms[user][currentChat];
            else if(dms[currentChat] && dms[currentChat][user]) chat = dms[currentChat][user];

            if(chat) {
                container.innerHTML = chat.messages.map(m => `
                    <div class="msg ${m.sender === user ? 'sent' : 'received'}">${m.text}</div>
                `).join('');
                container.scrollTop = container.scrollHeight;
            }
        }

        function renderSidebar() {
            const reqDiv = document.getElementById('dm-requests');
            const activeDiv = document.getElementById('active-chats');
            
            // Requests to ME
            let requests = [];
            if(dms[user]) {
                for(let sender in dms[user]) {
                    if(dms[user][sender].status === 'pending') requests.push(sender);
                }
            }
            reqDiv.innerHTML = requests.map(r => `
                <div class="dm-item">
                    <span>@${r.toUpperCase()}</span>
                    <span class="action" onclick="acceptDM('${r}')">ACEITAR</span>
                </div>
            `).join('') || '<div style="font-size:12px; color:#999">SEM PENDÊNCIAS</div>';

            // Active Chats
            let actives = [];
            if(dms[user]) {
                for(let sender in dms[user]) {
                    if(dms[user][sender].status === 'active') actives.push(sender);
                }
            }
            for(let target in dms) {
                if(dms[target][user] && dms[target][user].status === 'active') {
                    if(!actives.includes(target)) actives.push(target);
                }
            }

            activeDiv.innerHTML = actives.map(a => `
                <div class="dm-item" style="cursor:pointer" onclick="openDM('${a}')">
                    <span>@${a.toUpperCase()}</span>
                    <span class="badge">ATIVO</span>
                </div>
            `).join('') || '<div style="font-size:12px; color:#999">NENHUMA CONVERSA</div>';
        }

        function saveDMs() {
            localStorage.setItem('s_dms', JSON.stringify(dms));
        }

        init();
    </script>
</body>
</html>
